# Agendador do Sistema Leads MVP (fase 7).
# De segunda a sexta, das 9h às 18h (horário de Brasília), a cada 10 minutos chama o seu site, que então envia o próximo lote das campanhas em andamento
# (respeitando horário, limite diário, opt-in e opt-out).
#
# Precisa de 2 "Secrets" no GitHub (Settings > Secrets and variables > Actions):
#   SITE_URL     = endereço do site na Vercel, ex.: https://sistema-leads-mvp.vercel.app
#   CRON_SECRET  = a mesma senha definida na Vercel
name: Agendador

on:
  schedule:
    # O GitHub conta o horário em UTC (Brasília = UTC-3): 12h a 21h UTC = 9h a 18h59 em Brasília.
    # Limitar o horário mantém o uso dentro dos 2.000 minutos gratuitos por mês de repositórios privados.
    - cron: "*/10 12-21 * * 1-5"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: agendador
  cancel-in-progress: false

jobs:
  campanhas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar o agendador
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltam os Secrets SITE_URL e CRON_SECRET no GitHub."
            exit 1
          fi
          code=$(curl -sS -o resposta.json -w "%{http_code}" -X POST --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/campanhas")
          echo "Resposta do site: HTTP $code"
          cat resposta.json
          echo
          [ "$code" = "200" ]
