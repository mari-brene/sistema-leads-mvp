
name: Agendador

on:
  schedule:
    - cron: "*/10 12-21 * * 1-5"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: agendador
  cancel-in-progress: false

jobs:
  campanhas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar o agendador
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltam os Secrets SITE_URL e CRON_SECRET no GitHub."
            exit 1
          fi
          code=$(curl -sS -o resposta.json -w "%{http_code}" -X POST --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/campanhas")
          echo "Resposta do site: HTTP $code"
          cat resposta.json
          echo
          [ "$code" = "200" ]
